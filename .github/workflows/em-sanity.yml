# EM sanity tests (@sanity): fixed Jira issues stay fixed. Steps: em-run-tests.yml.
# Runs on em-test (the default since 2026-11-19). Manual only: Actions → EM Sanity → Run workflow. No push or
# scheduled runs, because some sanity tests post real transactions (EM-86 cash transfer, EM-79 wallet transfer), and the
# Settings smoke cases with a Jira link (SET-007/008/013/014/021) create categories and a payment method.
# For a subset (one issue, P1 only, Firefox) use EM tests (manual / Jira).
name: EM Sanity

on:
  workflow_dispatch:

concurrency:
  group: em-sanity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/em-run-tests.yml
    secrets: inherit
    with:
      suite: sanity
      tags: '@sanity'
