# EM sanity tests (@sanity): fixed Jira issues stay fixed. Steps: em-run-tests.yml.
# Manual only: Actions → EM Sanity → Run workflow. No push or scheduled runs, because some
# sanity tests post real transactions on UAT (EM-86 cash transfer, EM-79 wallet transfer).
# For a subset (one issue, P1 only, Firefox) use EM tests (manual / Jira).
name: EM Sanity

on:
  workflow_dispatch:

concurrency:
  group: em-sanity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/em-run-tests.yml
    secrets: inherit
    with:
      suite: sanity
      tags: '@sanity'
