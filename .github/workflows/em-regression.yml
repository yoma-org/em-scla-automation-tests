# EM full regression: every test except the Jira ticket tests. Steps: em-run-tests.yml.
# There is no @regression tag (the traceability check rejects it): every catalog case is
# regression, so the suite is "all tests with a priority tag, minus @open / @fixed". The ticket
# tests (SAN-EM…, tagged @open / @fixed) are left out because they check Jira issues against UAT
# data, and regression runs on em-test. Catalog cases with a Jira link are tagged @sanity too and
# stay in regression: they create their own data.
# Passes with nothing run until such tests exist.
name: EM Regression

on:
  schedule:
    - cron: '0 18 * * 5' # weekly, Saturday 01:00 Vietnam (UTC+7)
  workflow_dispatch: # e.g. before a release

concurrency:
  group: em-regression
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/em-run-tests.yml
    secrets: inherit
    with:
      suite: regression
      tags: '@P1+!@open+!@fixed @P2+!@open+!@fixed @P3+!@open+!@fixed'
      environment: em-test
      timeout: 180
