# EM tests, run by hand or from Jira, with any tags. Steps: em-run-tests.yml.
# Keep this file name: Jira Automation calls .../actions/workflows/em-tests.yml/dispatches.
#
# Run by hand: Actions → EM tests (manual / Jira) → Run workflow, then type the tags (scripts/run-tags.mjs):
#   @sanity                 sanity suite          @smoke     smoke suite        @e2e   E2E flows
#   @EM-92 @EM-93           tests of these Jira issues (space = OR)
#   @sanity+@P1             sanity tests that are also P1 (+ = AND)
#   @smoke+!@review         smoke without review cases (! = NOT)
#
# Automatic runs:
#   - Jira issue moved to QA → Jira Automation calls this workflow with tags=@<key>, comment=true
#     (setup: projects/em/docs/sanity-test/README.md#run-tests-when-a-ticket-is-fixed).
#
# Jira is OFF for now. To turn it on: add the JIRA_* secrets to the "em-uat" environment, then uncomment
# the 14:30 cron (every Jira issue in QA that has tests, results commented on each issue).
#
# Scheduled suites have their own workflows: em-sanity.yml, em-smoke.yml, em-e2e.yml, em-regression.yml.
name: EM tests (manual / Jira)

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Tags: @sanity, @smoke, @e2e, @EM-92 @EM-93 (space = OR), @sanity+@P1 (+ = AND), !@review (NOT)'
        required: true
        default: '@sanity'
      comment:
        description: 'Comment the result on the Jira issues in the tags (@EM-…)'
        type: boolean
        default: false
      environment:
        description: 'Environment: em-uat (check issues) or em-test (testing)'
        type: choice
        options: [em-uat, em-test]
        default: em-uat
      browser:
        description: 'Browser'
        type: choice
        options: [chromium, firefox]
        default: chromium
  # Jira off for now (needs JIRA_* secrets): 14:30 Vietnam, Jira issues in QA + comments
  # schedule:
  #   - cron: '30 7 * * 1-5'

concurrency:
  group: em-tests-${{ inputs.tags || github.event.schedule }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/em-run-tests.yml
    secrets: inherit
    with:
      suite: ${{ github.event_name == 'schedule' && 'jira-qa' || 'manual' }}
      tags: ${{ inputs.tags }}
      comment: ${{ inputs.comment == true }}
      browser: ${{ inputs.browser || 'chromium' }}
      environment: ${{ inputs.environment || 'em-uat' }}
      jira_qa: ${{ github.event_name == 'schedule' }}
      # Typed by hand: no matching test is an error (probably a typo). Scheduled Jira run: just skip.
      no_tests_ok: ${{ github.event_name == 'schedule' }}
